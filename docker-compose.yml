
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mobzilla
      POSTGRES_PASSWORD: mobzilla
      POSTGRES_DB: mobzilla
    ports:
      - "5433:5432"
    volumes:
      - mobzilla_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mobzilla -d mobzilla"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mobzilla_pg:
